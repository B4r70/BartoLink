[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barto-link"
version = "0.1.0"
description = "Personal push-notification gateway for the BartoAI ecosystem"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
